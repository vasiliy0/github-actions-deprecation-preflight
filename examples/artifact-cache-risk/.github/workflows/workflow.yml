name: artifact-cache-risk
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci && npm test
      - uses: actions/upload-artifact@v3
        with:
          name: test-output
          path: test-results/
  consume:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: test-output
